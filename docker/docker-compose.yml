services:
  # -------------------------------------------------------------
  # PostgreSQL Cluster (Multi-Database per Service)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learning-purpose-postgres
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "max_replication_slots=10",
      "-c", "max_wal_senders=10"
    ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - learning-purpose-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # PostgreSQL Administration: pgAdmin
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learning-purpose-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    networks:
      - learning-purpose-network
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Message Broker: Apache Kafka (KRaft Mode - No Zookeeper)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: learning-purpose-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - learning-purpose-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Debezium / Kafka Connect
  # -------------------------------------------------------------
  debezium:
    image: debezium/connect:2.6
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - learning-purpose-network

  debezium-ui:
    image: debezium/debezium-ui:2.0
    container_name: debezium-ui
    ports:
      - "9095:8080"
    environment:
      DEBEZIUM_CONNECT_URL: http://debezium:8083
    depends_on:
      debezium:
        condition: service_healthy
    networks:
      - learning-purpose-network

  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    depends_on:
      debezium:
        condition: service_started
    volumes:
      - ./debezium/register-connectors.sh:/register-connectors.sh:ro
      - ./debezium/connectors:/connectors:ro
      - ./kafka-connect:/kafka-connect:ro
    entrypoint: ["/bin/sh", "/register-connectors.sh"]
    restart: "no"
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Object Storage: MinIO (Community Fork: pgsty/minio)
  # -------------------------------------------------------------
  minio:
    image: pgsty/minio:latest 
    container_name: learning-purpose-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - miniodata:/data
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # MinIO Bucket Initialization
  # -------------------------------------------------------------
  minio-init:
    image: pgsty/mc:latest  # ✅ FIXED: Community fork
    container_name: learning-purpose-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...';
      until mc alias set myminio http://minio:9000 minioadmin minioadminpassword; do echo 'Waiting...'; sleep 2; done;
      echo 'Creating buckets...';
      mc mb --ignore-existing myminio/learning-purpose-blogs;
      mc mb --ignore-existing myminio/learning-purpose-books;
      mc mb --ignore-existing myminio/media-stream-bucket;
      echo 'Buckets created successfully!';
      exit 0;
      "
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Local SMTP Server: Mailpit
  # -------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: learning-purpose-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # MongoDB (Sink Database for CQRS Read Models)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: learning-purpose-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - learning-purpose-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Media Streaming Service
  # -------------------------------------------------------------
  mediasoup-service:
    build:
      context: ../services/mediasoup-service
      dockerfile: Dockerfile
    container_name: learning-purpose-mediasoup-service
    ports:
      - "3000:3000"
    networks:
      - learning-purpose-network
    depends_on:
      kafka:
        condition: service_healthy

  # -------------------------------------------------------------
  # APPLICATION MICROSERVICES
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVICES_USER_SERVICE=http://user-service:8081
      - SERVICES_EXAM_SERVICE=http://exam-service:8082
      - SERVICES_BLOG_SERVICE=http://blog-service:8084
      - SERVICES_BOOKSTORE_SERVICE=http://bookstore-service:8085
      - SERVICES_MEDIA_STREAMING_SERVICE=http://media-streaming-service:8086
      - SERVICES_AI_CHAT_SERVICE=http://ai-chat-service:8087
      - SERVICES_PLATFORM_OPS_SERVICE=http://platform-ops-service:8088
      - SERVICES_QUERY_SERVICE=http://query-service:8090
    depends_on:
      - user-service
      - exam-service
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/user_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  exam-service:
    build:
      context: ../services/exam-service
      dockerfile: Dockerfile
    container_name: exam-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/exam_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  blog-service:
    build:
      context: ../services/blog-service
      dockerfile: Dockerfile
    container_name: blog-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/blog_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  bookstore-service:
    build:
      context: ../services/bookstore-service
      dockerfile: Dockerfile
    container_name: learning-purpose-bookstore-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookstore_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  media-streaming-service:
    build:
      context: ../services/media-streaming-service
      dockerfile: Dockerfile
    container_name: learning-purpose-media-streaming-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/media_db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports: 
      - "8095:8085"
    environment:
      - SPRING_MAIL_HOST=mailpit
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  ai-chat-service:
    build: 
      context: ../services/ai-chat-service
      dockerfile: Dockerfile
    container_name: ai-chat-service
    ports: 
      - "8087:8087"
    environment:
      - EXAM_SERVICE_URL=http://exam-service:8082
    networks:
      - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  platform-ops-service:
    build:
      context: ../services/platform-ops-service
      dockerfile: Dockerfile
    container_name: platform-ops-service
    ports:
      - "8088:8088"
    environment:
      - PG_HOST=postgres
      - KAFKA_SERVERS=kafka:29092
      - MAIL_HOST=mailpit
      - MINIO_ENDPOINT=http://minio:9000
      - MAILPIT_URL=http://mailpit:8025
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_KEYSPACE_NAME=logs
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
    depends_on:
      postgres: 
        condition: service_healthy
      kafka: 
        condition: service_healthy 
      cassandra:
        condition: service_healthy
    networks: 
        - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  query-service:
    build:
      context: ../services/query-service
      dockerfile: Dockerfile
    container_name: query-service
    ports: 
      - "8090:8090"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/query-service
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mongodb: 
        condition: service_started 
      kafka: 
        condition: service_healthy 
    networks: 
        - learning-purpose-network
    volumes:
      - m2_cache:/root/.m2

  # -------------------------------------------------------------
  # FRONTEND: Angular Application
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../frontend/learning-purpose-ui
      dockerfile: Dockerfile
    container_name: learning-purpose-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Elasticsearch (Logs)
  # -------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: learning-purpose-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Kibana (Elasticsearch UI)
  # -------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: learning-purpose-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Filebeat (Log shipper to Elasticsearch)
  # -------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: learning-purpose-filebeat
    user: root
    command:
      - -e
      - --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../services/user-service/logs:/logs/user-service:ro
      - ../services/api-gateway/logs:/logs/api-gateway:ro
      - ../services/exam-service/logs:/logs/exam-service:ro
      - ../services/blog-service/logs:/logs/blog-service:ro
      - ../services/bookstore-service/logs:/logs/bookstore-service:ro
      - ../services/media-streaming-service/logs:/logs/media-streaming-service:ro
      - ../services/notification-service/logs:/logs/notification-service:ro
      - ../services/platform-ops-service/logs:/logs/platform-ops-service:ro
      - ../services/query-service/logs:/logs/query-service:ro
    depends_on:
      - elasticsearch
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Apache Cassandra (Log Storage)
  # -------------------------------------------------------------
  cassandra:
    image: cassandra:5.0
    container_name: learning-purpose-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=learning-purpose-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - learning-purpose-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------
  # Cassandra Schema Initialization (One-off container)
  # -------------------------------------------------------------
  cassandra-init:
    image: cassandra:5.0
    container_name: learning-purpose-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy 
    volumes:
      - ./cassandra/cassandra-schema.cql:/schema.cql:ro 
    command: /bin/sh -c "cqlsh cassandra -f /schema.cql" 
    networks:
      - learning-purpose-network
    restart: "no"

  # -------------------------------------------------------------
  # Vector Log Collector (Sends logs to Kafka)
  # -------------------------------------------------------------
  vector:
    image: timberio/vector:latest-alpine
    container_name: learning-purpose-vector
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Kafka Connect (Bridges Kafka -> Cassandra)
  # -------------------------------------------------------------

  kafka-connect-cassandra:
    build:
      context: .
      dockerfile: Dockerfile.kafka-connect-cassandra
    image: learning-purpose-kafka-connect-cassandra:local
    container_name: learning-purpose-kafka-connect-cassandra
    ports:
      - "8089:8083"
    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect-cassandra"
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      bootstrap.servers: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "cassandra-connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: "cassandra-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "cassandra-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "cassandra-connect-statuses"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/confluent-hub-components,/usr/share/java"
    command: 
      - bash 
      - -c 
      - |
        echo "Installing Confluent Cassandra Connector..."
        confluent-hub install --no-prompt confluentinc/kafka-connect-cassandra:latest
        echo "Starting Kafka Connect..."
        /etc/confluent/docker/run
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Cassandra Sink Connector Auto-Registration (One-off)
  # -------------------------------------------------------------
  cassandra-sink-init:
    image: curlimages/curl:latest
    container_name: learning-purpose-cassandra-sink-init
    depends_on:
      kafka-connect-cassandra:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-connect/register-connector.sh:/register-connector.sh:ro
      - ./cassandra-connect/cassandra-sink-config.json:/cassandra-sink-config.json:ro
    entrypoint: ["/bin/sh", "/register-connector.sh"]
    restart: "no"
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Dozzle - Real-time Docker Log Viewer
  # -------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: learning-purpose-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro 
      - dozzle_data:/data 
    environment:
      - DOZZLE_USERNAME=admin
      - DOZZLE_PASSWORD=admin
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
    networks:
      - learning-purpose-network
    restart: unless-stopped

networks:
  learning-purpose-network:
    driver: bridge

volumes:
  pgdata:
  kafkadata:
  miniodata:
  mongodata:
  pgadmindata:
  elasticsearch-data:
  m2_cache:
  cassandra_data:
  dozzle_data: