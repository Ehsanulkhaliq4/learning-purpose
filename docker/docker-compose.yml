version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Cluster (Multi-Database per Service)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learning-purpose-postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - learning-purpose-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # PostgreSQL Administration: pgAdmin
  # -------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: learning-purpose-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
    networks:
      - learning-purpose-network
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Message Broker: Apache Kafka (KRaft Mode - No Zookeeper)
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: learning-purpose-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Object Storage: MinIO (S3 Compatible API)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: learning-purpose-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - miniodata:/data
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Local SMTP Server: Mailpit (Email Mock & Web UI)
  # -------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: learning-purpose-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # MongoDB (Sink Database for CQRS Read Model)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: learning-purpose-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - learning-purpose-network

  # -------------------------------------------------------------
  # Kafka Connect (Debezium Runtime)
  # -------------------------------------------------------------
  connect:
    image: quay.io/debezium/connect:2.5
    container_name: learning-purpose-connect
    depends_on:
      - kafka
      - postgres
      - mongodb
    ports:
      - "8089:8083"
    environment:
      BOOTSTRAP_SERVERS: 'kafka:29092' # Use internal listener
      GROUP_ID: 'learning-purpose-connect-group'
      CONFIG_STORAGE_TOPIC: 'connect_configs'
      OFFSET_STORAGE_TOPIC: 'connect_offsets'
      STATUS_STORAGE_TOPIC: 'connect_statuses'
      CONNECT_REST_ADVERTISED_HOST_NAME: 'connect'
      CONNECT_REST_PORT: '8083'
      CONNECT_PLUGIN_PATH: '/kafka/connect,/kafka/connect/mongodb-kafka-connector'
    volumes:
      - ./mongodb-kafka-connector:/kafka/connect/mongodb-kafka-connector
    networks:
      - learning-purpose-network

networks:
  learning-purpose-network:
    driver: bridge

volumes:
  pgdata:
  kafkadata:
  miniodata:
  mongodata:
  pgadmindata: