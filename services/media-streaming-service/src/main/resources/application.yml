server:
  port: 8086

spring:
  application:
    name: media-streaming-service
  datasource:
    url: jdbc:postgresql://localhost:5432/media_db
    username: postgres
    password: postgrespassword
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadminpassword
  bucket-name: media-stream-bucket